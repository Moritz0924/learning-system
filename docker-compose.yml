x-app-env-files: &app-env-files
  - path: .env.example
    required: true
  - path: .env
    required: false

x-app-environment: &app-environment
  APP_ENV: "${APP_ENV:-production}"
  DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://tutor:tutor@postgres:5432/adaptive_tutor}"
  TUTOR_CHECKPOINT_BACKEND: "${TUTOR_CHECKPOINT_BACKEND:-postgres}"
  TUTOR_CHECKPOINT_DATABASE_URL: "${TUTOR_CHECKPOINT_DATABASE_URL:-}"
  TUTOR_HISTORY_MAX_TURNS: "${TUTOR_HISTORY_MAX_TURNS:-12}"
  TUTOR_HISTORY_MAX_ESTIMATED_TOKENS: "${TUTOR_HISTORY_MAX_ESTIMATED_TOKENS:-16000}"
  REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
  DOCUMENT_PROCESSING_MODE: "${DOCUMENT_PROCESSING_MODE:-celery}"
  DOCUMENT_OBJECT_STORAGE_BACKEND: "${DOCUMENT_OBJECT_STORAGE_BACKEND:-minio}"
  MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
  MINIO_BUCKET: "${MINIO_BUCKET:-adaptive-tutor-documents}"
  EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-openai}"
  EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}"
  EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-embedding-3}"
  EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-2048}"
  FEATURE_HYBRID_CHUNKING_V3: "${FEATURE_HYBRID_CHUNKING_V3:-true}"
  RAG_RETRIEVAL_BACKEND: "${RAG_RETRIEVAL_BACKEND:-pgvector}"
  OFFICIAL_SEARCH_PROVIDER: "${OFFICIAL_SEARCH_PROVIDER:-brave}"
  BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY:-}"
  LLM_PROVIDER: "${LLM_PROVIDER:-}"
  LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com}"
  LLM_API_KEY: "${LLM_API_KEY:-}"
  LLM_MODEL: "${LLM_MODEL:-deepseek-v4-flash}"
  DEEPSEEK_FLASH_MODEL: "${DEEPSEEK_FLASH_MODEL:-deepseek-v4-flash}"
  DEEPSEEK_PRO_MODEL: "${DEEPSEEK_PRO_MODEL:-deepseek-v4-pro}"
  DEEPSEEK_REASONING_EFFORT: "${DEEPSEEK_REASONING_EFFORT:-high}"
  OCR_BACKEND: "${OCR_BACKEND:-tesseract}"
  TESSERACT_LANG: "${TESSERACT_LANG:-eng+chi_sim}"
  OCR_VISION_FALLBACK: "${OCR_VISION_FALLBACK:-auto}"
  DOCUMENT_PARSER_VERSION: "${DOCUMENT_PARSER_VERSION:-document-parser-v3}"
  DOCUMENT_PDF_MIN_TEXT_CHARS: "${DOCUMENT_PDF_MIN_TEXT_CHARS:-50}"
  DOCUMENT_PDF_MIN_PRINTABLE_RATIO: "${DOCUMENT_PDF_MIN_PRINTABLE_RATIO:-0.95}"
  DOCUMENT_PDF_QUALITY_TARGET_CHARS: "${DOCUMENT_PDF_QUALITY_TARGET_CHARS:-200}"
  DOCUMENT_PDF_MIN_QUALITY_SCORE: "${DOCUMENT_PDF_MIN_QUALITY_SCORE:-0.80}"
  VISION_ENABLED: "${VISION_ENABLED:-true}"
  VISION_BASE_URL: "${VISION_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}"
  VISION_API_KEY: "${VISION_API_KEY:-}"
  VISION_MODEL: "${VISION_MODEL:-glm-4.5v}"
  MCP_HOST: "${MCP_HOST:-0.0.0.0}"
  MCP_PORT: "${MCP_PORT:-8001}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
  JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
  JWT_ISSUER: "${JWT_ISSUER:-learning-system}"
  JWT_AUDIENCE: "${JWT_AUDIENCE:-learning-system-api}"
  ACCESS_TOKEN_TTL_SECONDS: "${ACCESS_TOKEN_TTL_SECONDS:-900}"
  REFRESH_IDLE_TTL_SECONDS: "${REFRESH_IDLE_TTL_SECONDS:-604800}"
  REFRESH_ABSOLUTE_TTL_SECONDS: "${REFRESH_ABSOLUTE_TTL_SECONDS:-2592000}"
  REFRESH_ROTATION_GRACE_SECONDS: "${REFRESH_ROTATION_GRACE_SECONDS:-3}"
  AUTH_REFRESH_COOKIE_NAME: "${AUTH_REFRESH_COOKIE_NAME:-learning_refresh}"
  AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
  AUTH_COOKIE_SAMESITE: "${AUTH_COOKIE_SAMESITE:-lax}"
  AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:-}"
  AUTH_ALLOWED_ORIGINS: "${AUTH_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}"
  AUTH_REQUIRE_ORIGIN_CHECK: "${AUTH_REQUIRE_ORIGIN_CHECK:-true}"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-adaptive_tutor}"
      POSTGRES_USER: "${POSTGRES_USER:-tutor}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tutor}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    image: learning-system-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: *app-env-files
    environment:
      <<: *app-environment
    command: ["sh", "-c", "alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    image: learning-system-backend:local
    env_file: *app-env-files
    environment:
      <<: *app-environment
    command: ["celery", "-A", "backend.app.worker", "worker", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  scheduler:
    image: learning-system-backend:local
    env_file: *app-env-files
    environment:
      <<: *app-environment
    command: ["celery", "-A", "backend.app.worker", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  mcp:
    image: learning-system-backend:local
    env_file: *app-env-files
    environment:
      <<: *app-environment
    command: ["python", "-m", "backend.app.mcp_server"]
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
